name: publish userscript to fork pages

# Fork-only workflow (pc418). Builds the desktop Tampermonkey userscript from
# whatever is on `dev` and publishes it to this fork's GitHub Pages, so it can
# be installed from:
#   https://pc418.github.io/kiss-translator/kiss-translator.user.js
# The build points @updateURL/@downloadURL at that same URL, so Tampermonkey
# auto-updates from THIS fork instead of reverting to upstream's release.
# Upstream's release.yml only fires on v* tags, so it never runs here.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: fork-userscript-pages
  cancel-in-progress: true

permissions:
  contents: write # deploy action pushes to the gh-pages branch

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install

      # @version must STRICTLY increase forever or Tampermonkey silently stops
      # updating. The base version in .env only bumps on upstream syncs, so we
      # append a tail. Deliberately NOT github.run_number: that counter resets
      # to 1 if this workflow file is ever renamed or recreated, which sends the
      # version backwards (e.g. 2.0.32.15 -> 2.0.32.1) and permanently kills
      # auto-update. A UTC timestamp is monotonic regardless.
      - name: Compute userscript @version
        run: |
          base="$(node -p "require('./package.json').version")"
          ver="${base}.$(date -u +%y%m%d%H%M)"
          echo "USERSCRIPT_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "Building userscript @version = ${ver}"

      # Only build:web is needed for the desktop userscript. It writes
      # build/web/kiss-translator.user.js alongside the web options page.
      # GitHub Actions sets CI=true, so react-scripts treats warnings as errors
      # (same as upstream's own release build).
      - name: Build userscript
        env:
          REACT_APP_VERSION: ${{ env.USERSCRIPT_VERSION }}
          # Canonical install + auto-update URL. Requires Pages source to stay on
          # branch `gh-pages` / `(root)` (Settings -> Pages). If that ever gets
          # switched back to `dev`, every gh-pages file 404s and auto-update
          # silently dies -- the fallback is the same file at
          # https://raw.githubusercontent.com/pc418/kiss-translator/gh-pages/kiss-translator.user.js
          REACT_APP_USERSCRIPT_DOWNLOADURL: https://pc418.github.io/kiss-translator/kiss-translator.user.js
          # The Settings menu does window.open(REACT_APP_OPTIONSPAGE)
          # (src/libs/translatorManager.js:664,705). Left at its .env default it
          # opens UPSTREAM's hosted options page (kiss-translator.rayjar.com),
          # which is built from upstream's release and therefore lacks our
          # newer controls (e.g. parseLatex) -- the script has the feature but
          # the settings UI you see is someone else's build. Point it at our own
          # Pages options page. This same var is also one of the entries in
          # common.js isOptionsPageHref(), the allowlist that tells the script
          # it is running on the settings page and may use the storage bridge,
          # so overriding it here fixes both the open target and the allowlist.
          REACT_APP_OPTIONSPAGE: https://pc418.github.io/kiss-translator/options.html
        run: pnpm build:web

      - name: Show generated metadata header
        run: sed -n '1,20p' build/web/kiss-translator.user.js

      - name: Deploy build/web to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          single-commit: true
